# Provision the search database and runtime role through the root connection.
changeLogFile=search.xml
driver=org.postgresql.Driver
defaultSchemaName=public
liquibase.hub.mode=off
liquibase.command.url=jdbc:postgresql://@DB_HOST@:@DB_PORT@/@DB_ROOT@
liquibase.command.username=@DB_ROOT_USER@
liquibase.command.password=@DB_ROOT_PASS@
parameter.search_database_name=@DB_SEARCH_NAME@
parameter.search_writer=@DB_SEARCH_WRITER_USER@
parameter.search_writer_pwd=@DB_SEARCH_WRITER_USER_PWD_SQL@
