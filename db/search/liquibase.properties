# Extensions require the privileged migration connection, not the runtime writer.
changeLogFile=update.xml
driver=org.postgresql.Driver
defaultSchemaName=public
liquibase.hub.mode=off
liquibase.command.url=jdbc:postgresql://@DB_HOST@:@DB_PORT@/@DB_SEARCH_NAME@
liquibase.command.username=@DB_ROOT_USER@
liquibase.command.password=@DB_ROOT_PASS@
parameter.search_writer=@DB_SEARCH_WRITER_USER@
