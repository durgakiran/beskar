[SERVICE]
    Flush 5
    Log_Level info
    Parsers_File /fluent-bit/etc/beskar-parsers.conf

# Discover new container IDs without generating a per-container input file.
[INPUT]
    Name tail
    Path /var/lib/docker/containers/*/*-json.log
    Tag beskar.containers
    Parser docker_json
    Path_Key docker.log_path
    DB /state/containers.db
    DB.Compare_Filename On
    Read_from_Head On
    Mem_Buf_Limit 50MB
    Skip_Long_Lines On
    Refresh_Interval 5
    Rotate_Wait 30

# Filter Docker's labels before parsing application payloads.
[FILTER]
    Name grep
    Match beskar.*
    Logical_Op AND
    Regex $attrs['com.docker.compose.project'] ^${BESKAR_LOG_PROJECT}$
    Regex $attrs['com.docker.compose.service'] ^(server|signalserver|postgres|redis|proxy|guard|zitadel)$

# Lift the selected labels so they can become stable service/project fields.
[FILTER]
    Name nest
    Match beskar.*
    Operation lift
    Nested_under attrs
    Add_prefix docker.

[FILTER]
    Name parser
    Match beskar.*
    Key_Name log
    Parser application_json
    Reserve_Data On
    Preserve_Key On

[FILTER]
    Name modify
    Match beskar.*
    Hard_rename docker.com.docker.compose.service service
    Hard_rename docker.com.docker.compose.project compose.project
    Rename log message
    Set environment ${BESKAR_LOG_ENVIRONMENT}

[OUTPUT]
    Name newrelic
    Match beskar.*
    licenseKey ${NEW_RELIC_LICENSE_KEY}
    endpoint ${NEW_RELIC_LOG_ENDPOINT}
